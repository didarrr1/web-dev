<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Event Invite</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            color: #333;
        }
        .invite {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border: 2px solid #4caf50;
            border-radius: 10px;
        }
        .go {
            display: block;
            width: 150px;
            margin: 15px auto 0;
            padding: 10px;
            background: #4caf50;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="invite">
        <h1>Welcome Party</h1>
        <p><strong>Date:</strong> January 1, 2026</p>
        <p><strong>Time:</strong> 2–6 PM</p>
        <p><strong>Location:</strong> Tole Bi 59</p>
        <a href="#" class="go">Go</a>
    </div>

</body>
</html>
