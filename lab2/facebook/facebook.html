<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Facebook</title>
    <link rel="icon" type="image/x-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Facebook_Logo_2023.png/960px-Facebook_Logo_2023.png?20231011121526">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div class="left">
        <h1 class="logo">facebook</h1>
        <p class="desc">
            Facebook помогает вам всегда<br>
            оставаться на связи и общаться со<br>
            своими знакомыми.
        </p>
    </div>

    <div class="right">
        <div class="login-box">
            <label>
                <input type="text" placeholder="Электронный адрес или номер телефона">
            </label>
            <label>
                <input type="password" placeholder="Пароль">
            </label>
            <button type="submit">Вход</button>
            <a id="pass" href="#">Забыли пароль?</a>
            <hr class="divider">
            <a id="pass1" href="#">Создать новый аккаунт</a>
        </div>

        <p class="create-page">
            <strong>Создать Страницу</strong> знаменитости, музыкальной группы или компании.
        </p>
    </div>
</body>
</html>
